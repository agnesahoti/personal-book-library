<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biblioteka — Studentët</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="layout">
<aside class="sidebar">
  <div class="sidebar-brand"><div class="sidebar-logo">📚</div><div class="sidebar-title">Biblioteka</div><div class="sidebar-role role-admin">⚙️ Administrator</div></div>
  <nav class="sidebar-nav" id="sidebar-nav"></nav>
  <div class="sidebar-footer">
    <div class="sidebar-user-row"><div class="sidebar-avatar">A</div><div><div class="sidebar-user-name" id="sidebar-user-name"></div><div class="sidebar-user-role" id="sidebar-user-role"></div></div></div>
    <button class="logout-btn" onclick="logout()">🚪 Dil nga sistemi</button>
  </div>
</aside>
<div class="main">
  <div class="topbar">
    <div class="topbar-left"><div class="page-title">👥 Studentët</div></div>
    <div class="topbar-right">
      <button class="btn btn-outline btn-sm" onclick="exportCSV()">📥 Eksporto CSV</button>
      <div class="topbar-avatar" id="topbar-avatar">A</div>
      <span id="topbar-user-name" style="font-size:14px;color:var(--muted);margin-left:8px;"></span>
    </div>
  </div>
  <div class="content">
    <div class="panel fade-in">
      <div class="panel-title"><span class="p-icon">👤</span> Regjistro Student të Ri</div>
      <div class="form-grid">
        <div class="ff"><label>Emri i Plotë *</label><input id="s-name" type="text" placeholder="p.sh. Arta Krasniqi"></div>
        <div class="ff"><label>ID Studenti *</label><input id="s-id" type="text" placeholder="p.sh. STU-2024-001"></div>
        <div class="ff"><label>Email</label><input id="s-email" type="email" placeholder="arta@uni.edu"></div>
        <div class="ff"><label>Telefoni</label><input id="s-phone" type="text" placeholder="+383 44 000 000"></div>
        <div class="ff"><label>Fakulteti</label>
          <select id="s-faculty"><option value="">— Zgjidh —</option><option>Shkenca Kompjuterike</option><option>Inxhinieri</option><option>Mjekësi</option><option>Drejtësi</option><option>Ekonomi</option><option>Arte</option><option>Letërsi</option><option>Tjetër</option></select>
        </div>
        <div class="ff"><label>Viti i Studimeve</label>
          <select id="s-year"><option value="1">Viti 1</option><option value="2">Viti 2</option><option value="3">Viti 3</option><option value="4">Viti 4</option><option value="Master">Master</option></select>
        </div>
      </div>
      <button class="btn btn-gold" style="margin-top:14px;width:100%;" onclick="addStudent()">+ Regjistro Student</button>
    </div>
 
    <div class="toolbar">
      <div class="search-box"><span class="si">🔍</span><input id="s-search" type="text" placeholder="Kërko emër ose ID..." oninput="renderStudents()"></div>
      <select class="fsel" id="s-fac" onchange="renderStudents()"><option value="">Të gjitha fakultetet</option><option>Shkenca Kompjuterike</option><option>Inxhinieri</option><option>Mjekësi</option><option>Drejtësi</option><option>Ekonomi</option><option>Arte</option><option>Letërsi</option><option>Tjetër</option></select>
    </div>
 
    <div class="panel fade-in" style="padding:0;overflow:hidden;">
      <div class="table-wrap">
        <table>
          <thead><tr><th>Emri</th><th>ID Studenti</th><th>Fakulteti</th><th>Viti</th><th>Email</th><th>Huazime</th><th>Gjoba</th><th>Veprime</th></tr></thead>
          <tbody id="s-tbody"></tbody>
        </table>
      </div>
    </div>
    <div class="empty" id="s-empty"><div class="empty-icon">👥</div><div class="empty-title">Nuk ka studentë</div><p class="empty-sub">Regjistro studentin e parë.</p></div>
  </div>
</div>
</div>
 
<!-- DETAIL MODAL -->
<div class="modal-overlay" id="detail-modal">
  <div class="modal" style="width:560px;">
    <div class="modal-title" id="detail-title">👤 Profili</div>
    <div id="detail-content"></div>
    <div class="modal-btns"><button class="mcancel" onclick="closeModal('detail-modal')">Mbyll</button></div>
  </div>
</div>
 
<div class="toast" id="toast"><div class="tdot"></div><span id="toast-msg"></span></div>
<script src="../js/data.js"></script>
<script src="../js/nav.js"></script>
<script>
renderAdminNav('students.html');
let state = loadAll();
 
function addStudent(){
  const name=document.getElementById('s-name').value.trim();
  const sid=document.getElementById('s-id').value.trim();
  const email=document.getElementById('s-email').value.trim();
  const phone=document.getElementById('s-phone').value.trim();
  const faculty=document.getElementById('s-faculty').value;
  const year=document.getElementById('s-year').value;
  if(!name||!sid){toast('⚠️ Emri dhe ID janë të detyrueshme!','error');return;}
  if(state.students.find(s=>s.studentId===sid)){toast('⚠️ Ky ID ekziston tashmë!','error');return;}
  state.students.push({id:state.nextStudentId++,name,studentId:sid,email,phone,faculty,year,joined:todayStr()});
  saveAll(state);
  ['s-name','s-id','s-email','s-phone'].forEach(id=>document.getElementById(id).value='');
  renderStudents();toast(`👤 "${name}" u regjistrua!`,'success');
}
 
function openDetail(id){
  const s=state.students.find(x=>x.id===id);
  const sr=state.rents.filter(r=>r.studentId===id);
  const active=sr.filter(r=>r.status==='active').length;
  const spent=sr.reduce((sum,r)=>sum+r.price,0);
  const fines=sr.reduce((sum,r)=>sum+calcFine(r)+(r.fine||0),0);
  document.getElementById('detail-title').textContent='👤 '+s.name;
  document.getElementById('detail-content').innerHTML=`
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px;">
      ${[['ID',s.studentId],['Email',s.email||'—'],['Telefoni',s.phone||'—'],['Fakulteti',s.faculty||'—'],['Viti','Viti '+s.year],['Regjistruar',s.joined||'—'],['Libra Aktive',active+'/'+MAX_RENTS],['Total Paguar','€'+spent.toFixed(2)],['Gjoba','€'+fines.toFixed(2)],['Huazime Gjithsej',sr.length]].map(([l,v])=>`
      <div style="background:var(--bg);padding:12px;border-radius:8px;">
        <div style="font-size:10px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:3px;">${l}</div>
        <div style="font-size:14px;font-weight:600;color:var(--text);">${v}</div>
      </div>`).join('')}
    </div>
    <div style="font-size:13px;font-weight:700;margin-bottom:10px;">📋 Historia</div>
    ${!sr.length?'<p style="color:var(--muted);font-size:13px;">Asnjë huazim.</p>':sr.map(r=>{const b=state.books.find(x=>x.id===r.bookId);const fine=calcFine(r);return`<div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);"><div><div style="font-size:13px;font-weight:600;">${b?b.title:'I fshirë'}</div><div style="font-size:11px;color:var(--muted);">${r.dateRented} → ${r.dateReturn}</div></div><div style="text-align:right;"><div style="font-weight:700;color:var(--green);">€${r.price.toFixed(2)}</div>${fine>0?`<div style="font-size:11px;color:var(--red);">+€${fine.toFixed(2)} gjobë</div>`:''}<div style="font-size:10px;color:var(--muted);">${r.status==='active'?'🟢 Aktiv':'✅ Kthyer'}</div></div></div>`;}).join('')}`;
  openModal('detail-modal');
}
 
function deleteStudent(id){
  const s=state.students.find(x=>x.id===id);
  if(state.rents.find(r=>r.studentId===id&&r.status==='active')){toast('⚠️ Ka libra aktive!','error');return;}
  if(!confirm(`Fshi "${s.name}"?`))return;
  state.students=state.students.filter(x=>x.id!==id);
  saveAll(state);renderStudents();toast(`🗑️ "${s.name}" u fshi.`);
}
 
function renderStudents(){
  const q=document.getElementById('s-search').value.toLowerCase();
  const fac=document.getElementById('s-fac').value;
  let list=state.students.filter(s=>{
    const mq=!q||s.name.toLowerCase().includes(q)||s.studentId.toLowerCase().includes(q);
    const mf=!fac||s.faculty===fac;
    return mq&&mf;
  });
  const tbody=document.getElementById('s-tbody');
  const empty=document.getElementById('s-empty');
  if(!list.length){tbody.innerHTML='';empty.classList.add('show');return;}
  empty.classList.remove('show');
  tbody.innerHTML=list.map(s=>{
    const sr=state.rents.filter(r=>r.studentId===s.id);
    const active=sr.filter(r=>r.status==='active').length;
    const fines=sr.reduce((sum,r)=>sum+calcFine(r),0);
    return`<tr>
      <td><strong style="cursor:pointer;color:var(--blue);" onclick="openDetail(${s.id})">${s.name}</strong></td>
      <td><span class="badge badge-blue">${s.studentId}</span></td>
      <td>${s.faculty||'—'}</td>
      <td>Viti ${s.year||'—'}</td>
      <td style="font-size:13px;">${s.email||'—'}</td>
      <td><span class="badge ${active>0?'badge-green':'badge-gray'}">${active}/${MAX_RENTS}</span></td>
      <td>${fines>0?`<span class="badge badge-red">€${fines.toFixed(2)}</span>`:'<span class="badge badge-green">€0</span>'}</td>
      <td style="display:flex;gap:6px;">
        <button class="btn btn-outline btn-sm" onclick="openDetail(${s.id})">👁️</button>
        <button class="btn btn-red btn-sm" onclick="deleteStudent(${s.id})">🗑️</button>
      </td>
    </tr>`;
  }).join('');
}
 
function exportCSV(){
  let csv='Emri,ID Studenti,Email,Fakulteti,Viti,Huazime\n';
  state.students.forEach(s=>{const cnt=state.rents.filter(r=>r.studentId===s.id).length;csv+=`"${s.name}","${s.studentId}","${s.email||''}","${s.faculty||''}","${s.year||''}",${cnt}\n`;});
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8;'}));a.download='studentet.csv';a.click();
  toast('📥 studentet.csv u shkarkua!');
}
 
renderStudents();
</script>
</body>
</html>
