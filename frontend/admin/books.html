<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biblioteka — Librat</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="layout">
<aside class="sidebar">
  <div class="sidebar-brand"><div class="sidebar-logo">📚</div><div class="sidebar-title">Biblioteka</div><div class="sidebar-role role-admin">⚙️ Administrator</div></div>
  <nav class="sidebar-nav" id="sidebar-nav"></nav>
  <div class="sidebar-footer">
    <div class="sidebar-user-row"><div class="sidebar-avatar">A</div><div><div class="sidebar-user-name" id="sidebar-user-name"></div><div class="sidebar-user-role" id="sidebar-user-role"></div></div></div>
    <button class="logout-btn" onclick="logout()">🚪 Dil nga sistemi</button>
  </div>
</aside>
<div class="main">
  <div class="topbar">
    <div class="topbar-left"><div class="page-title">📚 Librat</div></div>
    <div class="topbar-right">
      <button class="btn btn-outline btn-sm" onclick="exportCSV()">📥 Eksporto CSV</button>
      <div class="topbar-avatar" id="topbar-avatar">A</div>
      <span id="topbar-user-name" style="font-size:14px;color:var(--muted);margin-left:8px;"></span>
    </div>
  </div>
  <div class="content">
    <!-- ADD FORM -->
    <div class="panel fade-in">
      <div class="panel-title"><span class="p-icon">➕</span> Shto Libër të Ri</div>
      <div class="form-grid">
        <div class="ff"><label>Titulli *</label><input id="b-title" type="text" placeholder="p.sh. Fizikë Kuantike"></div>
        <div class="ff"><label>Autori *</label><input id="b-author" type="text" placeholder="p.sh. Richard Feynman"></div>
        <div class="ff"><label>Zhanri / Lënda</label>
          <select id="b-genre"><option value="">— Zgjidh —</option><option>Matematikë</option><option>Fizikë</option><option>Kimi</option><option>Biologji</option><option>Histori</option><option>Letërsi</option><option>Filozofi</option><option>Ekonomi</option><option>Teknologji</option><option>Fiction</option><option>Tjetër</option></select>
        </div>
        <div class="ff"><label>Përshkrimi</label><input id="b-desc" type="text" placeholder="Përshkrim i shkurtër..."></div>
        <div class="ff"><label>Çmimi Normal (€) *</label><input id="b-price" type="number" min="0" step="0.5" placeholder="15.00"></div>
        <div class="ff"><label>Çmimi Student (€)</label><input id="b-price-s" type="number" min="0" step="0.5" placeholder="lëre bosh = 50% automatik"></div>
        <div class="ff"><label>Kopje në Stok</label><input id="b-stock" type="number" min="1" value="1"></div>
        <div class="ff"><label>Foto Kopertine (URL)</label><input id="b-cover" type="text" placeholder="https://... (opsionale)"></div>
      </div>
      <button class="btn btn-gold" style="margin-top:14px;width:100%;" onclick="addBook()">+ Shto Libër</button>
    </div>
 
    <!-- TOOLBAR -->
    <div class="toolbar">
      <div class="search-box"><span class="si">🔍</span><input id="b-search" type="text" placeholder="Kërko titull ose autor..." oninput="renderBooks()"></div>
      <select class="fsel" id="b-gf" onchange="renderBooks()"><option value="">Të gjitha lëndët</option><option>Matematikë</option><option>Fizikë</option><option>Kimi</option><option>Biologji</option><option>Histori</option><option>Letërsi</option><option>Filozofi</option><option>Ekonomi</option><option>Teknologji</option><option>Fiction</option><option>Tjetër</option></select>
      <select class="fsel" id="b-sort" onchange="renderBooks()"><option value="">Default</option><option value="az">A → Z</option><option value="price-asc">Çmimi ↑</option><option value="price-desc">Çmimi ↓</option><option value="stock">Stoku ↑</option></select>
    </div>
 
    <!-- TABLE -->
    <div class="panel fade-in" style="padding:0;overflow:hidden;">
      <div class="table-wrap">
        <table>
          <thead><tr><th>Kopertina</th><th>Titulli</th><th>Autori</th><th>Zhanri</th><th>Normal</th><th>Student</th><th>Stoku</th><th>Veprime</th></tr></thead>
          <tbody id="books-tbody"></tbody>
        </table>
      </div>
    </div>
    <div class="empty" id="b-empty"><div class="empty-icon">📖</div><div class="empty-title">Nuk ka libra</div><p class="empty-sub">Shto librin e parë.</p></div>
  </div>
</div>
</div>
 
<!-- EDIT MODAL -->
<div class="modal-overlay" id="edit-modal">
  <div class="modal">
    <div class="modal-title">✏️ Edito Librin</div>
    <div class="form-grid">
      <div class="ff"><label>Titulli</label><input id="e-title" type="text"></div>
      <div class="ff"><label>Autori</label><input id="e-author" type="text"></div>
      <div class="ff"><label>Zhanri</label><select id="e-genre"><option value="">—</option><option>Matematikë</option><option>Fizikë</option><option>Kimi</option><option>Biologji</option><option>Histori</option><option>Letërsi</option><option>Filozofi</option><option>Ekonomi</option><option>Teknologji</option><option>Fiction</option><option>Tjetër</option></select></div>
      <div class="ff"><label>Përshkrimi</label><input id="e-desc" type="text"></div>
      <div class="ff"><label>Çmimi Normal (€)</label><input id="e-price" type="number" step="0.5"></div>
      <div class="ff"><label>Çmimi Student (€)</label><input id="e-price-s" type="number" step="0.5"></div>
      <div class="ff"><label>Stoku</label><input id="e-stock" type="number" min="0"></div>
      <div class="ff"><label>Foto URL</label><input id="e-cover" type="text"></div>
    </div>
    <div class="modal-btns"><button class="mcancel" onclick="closeModal('edit-modal')">Anulo</button><button class="msave" onclick="saveEdit()">Ruaj</button></div>
  </div>
</div>
 
<div class="toast" id="toast"><div class="tdot"></div><span id="toast-msg"></span></div>
<script src="../js/data.js"></script>
<script src="../js/nav.js"></script>
<script>
renderAdminNav('books.html');
let state = loadAll(), editId = null;
 
function addBook() {
  const title=document.getElementById('b-title').value.trim();
  const author=document.getElementById('b-author').value.trim();
  const genre=document.getElementById('b-genre').value;
  const desc=document.getElementById('b-desc').value.trim();
  const price=parseFloat(document.getElementById('b-price').value)||0;
  const priceS=parseFloat(document.getElementById('b-price-s').value)||0;
  const stock=parseInt(document.getElementById('b-stock').value)||1;
  const coverUrl=document.getElementById('b-cover').value.trim();
  if(!title||!author){toast('⚠️ Titulli dhe autori janë të detyrueshëm!','error');return;}
  if(price<=0){toast('⚠️ Vendos çmim valid!','error');return;}
  const idx=(state.nextBookId-1)%BOOK_COVERS.length;
  state.books.push({id:state.nextBookId++,title,author,genre,description:desc,price,priceStudent:priceS||+(price*.5).toFixed(2),stock,color:SPINES[(state.nextBookId-2)%SPINES.length],coverIdx:idx,customCover:coverUrl||null});
  saveAll(state);
  ['b-title','b-author','b-desc','b-price','b-price-s','b-cover'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('b-stock').value='1';
  renderBooks();toast(`📚 "${title}" u shtua!`,'success');
}
 
function openEdit(id) {
  editId=id; const b=state.books.find(x=>x.id===id);
  document.getElementById('e-title').value=b.title;
  document.getElementById('e-author').value=b.author;
  document.getElementById('e-genre').value=b.genre||'';
  document.getElementById('e-desc').value=b.description||'';
  document.getElementById('e-price').value=b.price;
  document.getElementById('e-price-s').value=b.priceStudent;
  document.getElementById('e-stock').value=b.stock;
  document.getElementById('e-cover').value=b.customCover||'';
  openModal('edit-modal');
}
 
function saveEdit() {
  const b=state.books.find(x=>x.id===editId);
  b.title=document.getElementById('e-title').value.trim();
  b.author=document.getElementById('e-author').value.trim();
  b.genre=document.getElementById('e-genre').value;
  b.description=document.getElementById('e-desc').value.trim();
  b.price=parseFloat(document.getElementById('e-price').value)||b.price;
  b.priceStudent=parseFloat(document.getElementById('e-price-s').value)||b.priceStudent;
  b.stock=parseInt(document.getElementById('e-stock').value)||b.stock;
  b.customCover=document.getElementById('e-cover').value.trim()||null;
  saveAll(state);closeModal('edit-modal');renderBooks();toast(`✅ "${b.title}" u përditësua!`,'success');
}
 
function deleteBook(id) {
  const b=state.books.find(x=>x.id===id);
  if(state.rents.find(r=>r.bookId===id&&r.status==='active')){toast(`⚠️ "${b.title}" ka huazim aktiv!`,'error');return;}
  if(!confirm(`Fshi "${b.title}"?`))return;
  state.books=state.books.filter(x=>x.id!==id);
  saveAll(state);renderBooks();toast(`🗑️ "${b.title}" u fshi.`);
}
 
function renderBooks() {
  const q=document.getElementById('b-search').value.toLowerCase();
  const genre=document.getElementById('b-gf').value;
  const sort=document.getElementById('b-sort').value;
  let list=state.books.filter(b=>{
    const mq=!q||b.title.toLowerCase().includes(q)||b.author.toLowerCase().includes(q);
    const mg=!genre||b.genre===genre;
    return mq&&mg;
  });
  if(sort==='az')list.sort((a,b)=>a.title.localeCompare(b.title));
  else if(sort==='price-asc')list.sort((a,b)=>a.price-b.price);
  else if(sort==='price-desc')list.sort((a,b)=>b.price-a.price);
  else if(sort==='stock')list.sort((a,b)=>a.stock-b.stock);
  const tbody=document.getElementById('books-tbody');
  const empty=document.getElementById('b-empty');
  if(!list.length){tbody.innerHTML='';empty.classList.add('show');return;}
  empty.classList.remove('show');
  const sc=b=>b.stock===0?'badge-red':b.stock<=2?'badge-gold':'badge-green';
  const sl=b=>b.stock===0?'❌ Pa stok':b.stock<=2?`⚠️ ${b.stock}`:`✅ ${b.stock}`;
  const disc=b=>Math.round((1-b.priceStudent/b.price)*100);
  tbody.innerHTML=list.map(b=>{
    const cover=b.customCover||BOOK_COVERS[b.coverIdx%BOOK_COVERS.length];
    return`<tr>
      <td><img src="${cover}" style="width:36px;height:48px;object-fit:cover;border-radius:4px;" onerror="this.style.display='none'"></td>
      <td><strong>${b.title}</strong>${b.description?`<div style="font-size:11px;color:var(--muted);margin-top:2px;">${b.description.slice(0,40)}...</div>`:''}</td>
      <td>${b.author}</td>
      <td>${b.genre?`<span class="badge badge-gold">${b.genre}</span>`:'—'}</td>
      <td><s style="color:var(--muted)">€${b.price.toFixed(2)}</s></td>
      <td><strong style="color:var(--green)">€${b.priceStudent.toFixed(2)}</strong> <span style="font-size:10px;color:var(--green);">-${disc(b)}%</span></td>
      <td><span class="badge ${sc(b)}">${sl(b)}</span></td>
      <td style="display:flex;gap:6px;">
        <button class="btn btn-outline btn-sm" onclick="openEdit(${b.id})">✏️</button>
        <button class="btn btn-red btn-sm" onclick="deleteBook(${b.id})">🗑️</button>
      </td>
    </tr>`;
  }).join('');
}
 
function exportCSV(){
  let csv='ID,Titulli,Autori,Zhanri,Çmimi Normal,Çmimi Student,Stoku\n';
  state.books.forEach(b=>csv+=`${b.id},"${b.title}","${b.author}","${b.genre||''}",€${b.price.toFixed(2)},€${b.priceStudent.toFixed(2)},${b.stock}\n`);
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8;'}));a.download='librat.csv';a.click();
  toast('📥 librat.csv u shkarkua!');
}
 
renderBooks();
</script>
</body>
</html>
