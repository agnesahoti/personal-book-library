<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biblioteka — Mesazhet</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="layout">
<aside class="sidebar">
  <div class="sidebar-brand"><div class="sidebar-logo">📚</div><div class="sidebar-title">Biblioteka</div><div class="sidebar-role role-admin">⚙️ Administrator</div></div>
  <nav class="sidebar-nav" id="sidebar-nav"></nav>
  <div class="sidebar-footer">
    <div class="sidebar-user-row"><div class="sidebar-avatar">A</div><div><div class="sidebar-user-name" id="sidebar-user-name"></div><div class="sidebar-user-role" id="sidebar-user-role"></div></div></div>
    <button class="logout-btn" onclick="logout()">🚪 Dil nga sistemi</button>
  </div>
</aside>
<div class="main">
  <div class="topbar">
    <div class="topbar-left"><div class="page-title">💬 Mesazhet</div></div>
    <div class="topbar-right"><div class="topbar-avatar" id="topbar-avatar">A</div><span id="topbar-user-name" style="font-size:14px;color:var(--muted);margin-left:8px;"></span></div>
  </div>
  <div class="content">
    <div style="display:grid;grid-template-columns:280px 1fr;gap:20px;height:calc(100vh - 130px);">
      <!-- Contacts list -->
      <div class="panel" style="padding:0;overflow:hidden;display:flex;flex-direction:column;">
        <div style="padding:16px 20px;border-bottom:1px solid var(--border);font-weight:600;font-size:14px;">Studentët</div>
        <div id="contacts" style="flex:1;overflow-y:auto;padding:8px;"></div>
      </div>
      <!-- Chat area -->
      <div class="panel" style="padding:0;overflow:hidden;display:flex;flex-direction:column;">
        <div style="padding:16px 20px;border-bottom:1px solid var(--border);font-weight:600;font-size:14px;" id="chat-title">Zgjidh një student</div>
        <div class="chat-wrap" id="chat-messages" style="flex:1;border:none;border-radius:0;margin:0;"></div>
        <div style="padding:14px 16px;border-top:1px solid var(--border);display:flex;gap:10px;">
          <input type="text" id="admin-msg" placeholder="Shkruaj përgjigjen..." style="flex:1;padding:11px 14px;border:1.5px solid var(--border);border-radius:9px;font-family:'Outfit',sans-serif;font-size:14px;outline:none;" onkeydown="if(event.key==='Enter')sendAdminMsg()">
          <button class="btn btn-gold" onclick="sendAdminMsg()">Dërgo →</button>
        </div>
      </div>
    </div>
  </div>
</div>
</div>
<div class="toast" id="toast"><div class="tdot"></div><span id="toast-msg"></span></div>
<script src="../js/data.js"></script>
<script src="../js/nav.js"></script>
<script>
renderAdminNav('messages.html');
let state=loadAll(), selStudentId=null;
 
function renderContacts(){
  const students=state.students;
  const contacts=document.getElementById('contacts');
  contacts.innerHTML=students.map(s=>{
    const msgs=state.messages.filter(m=>m.studentId===s.id);
    const unread=msgs.filter(m=>m.from==='student'&&!m.readByAdmin).length;
    const last=msgs.length?msgs[msgs.length-1]:null;
    return`<div onclick="selectStudent(${s.id})" style="padding:12px;border-radius:10px;cursor:pointer;transition:all .2s;border:1.5px solid ${selStudentId===s.id?'var(--gold)':'transparent'};background:${selStudentId===s.id?'var(--gold-bg)':'transparent'};" onmouseover="this.style.background='var(--bg)'" onmouseout="this.style.background='${selStudentId===s.id?'var(--gold-bg)':'transparent'}'">
      <div style="display:flex;align-items:center;gap:10px;">
        <div style="width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--blue),#3b82f6);display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:15px;flex-shrink:0;">${s.name.charAt(0)}</div>
        <div style="flex:1;min-width:0;">
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <div style="font-size:13px;font-weight:600;color:var(--text);">${s.name}</div>
            ${unread>0?`<span class="badge badge-red" style="font-size:10px;">${unread}</span>`:''}
          </div>
          <div style="font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${last?last.text.slice(0,30)+'...':s.faculty||'Student'}</div>
        </div>
      </div>
    </div>`;
  }).join('');
}
 
function selectStudent(id){
  selStudentId=id;
  const msgs=state.messages.filter(m=>m.studentId===id);
  msgs.forEach(m=>{if(m.from==='student')m.readByAdmin=true;});
  saveAll(state);
  const s=state.students.find(x=>x.id===id);
  document.getElementById('chat-title').textContent='💬 '+s.name+' — '+s.faculty;
  renderChat();renderContacts();
}
 
function renderChat(){
  if(!selStudentId)return;
  const msgs=state.messages.filter(m=>m.studentId===selStudentId);
  const chatEl=document.getElementById('chat-messages');
  chatEl.innerHTML=msgs.length?msgs.map(m=>{
    const isAdmin=m.from==='admin';
    return`<div class="chat-msg ${isAdmin?'me':''}">
      <div class="chat-avatar" style="background:${isAdmin?'linear-gradient(135deg,var(--gold),var(--gold-l))':'linear-gradient(135deg,var(--blue),#3b82f6)'};">${isAdmin?'A':m.studentName?.charAt(0)||'S'}</div>
      <div><div class="chat-bubble">${m.text}</div><div class="chat-time">${m.time}</div></div>
    </div>`;
  }).join(''):'<p style="color:var(--muted);font-size:13px;text-align:center;padding:20px;">Nuk ka mesazhe nga ky student.</p>';
  chatEl.scrollTop=chatEl.scrollHeight;
}
 
function sendAdminMsg(){
  if(!selStudentId){toast('⚠️ Zgjidh studentin!','error');return;}
  const text=document.getElementById('admin-msg').value.trim();
  if(!text)return;
  state.messages.push({id:state.nextMsgId++,studentId:selStudentId,from:'admin',text,time:new Date().toLocaleTimeString('sq-AL',{hour:'2-digit',minute:'2-digit'}),readByAdmin:true,readByStudent:false});
  saveAll(state);document.getElementById('admin-msg').value='';
  renderChat();renderContacts();
}
 
renderContacts();
</script>
</body>
</html>
